<!-- ============================================================
  East End Roses — Order Page (standalone / Vercel)
  ------------------------------------------------------------
  WHAT THIS DOES:
  Client picks one or more products + scents + quantities. On
  "Place Order":
   1. Page asks /api/order to create a FRESH Square payment link
      for this order (with a unique order ref embedded).
   2. Client is sent to Secure Checkout and pays on Square.
   3. Square sends a payment.completed webhook to /api/square-webhook,
      which logs each line item as a separate row to your Google
      Sheet (with name, email, and order ref). Nothing is logged
      until payment clears.
  ------------------------------------------------------------
  HOW TO EDIT (important):
  - PRODUCTS: edit names, prices, and scents below. Base prices are
    also used by api/order.js (cents) — keep them in sync.
  - If you arrive back on this page with ?ref=EER-XXXXXX in the
    URL, the page shows a "thank you" confirmation.
=========================================================== -->

<style>
  #eer-order * { box-sizing: border-box; }
  #eer-order {
    max-width: 600px;
    margin: 0 auto;
    font-family: Georgia, 'Times New Roman', serif;
    color: #f3ece2;
    padding: 40px 20px;
    min-height: 100vh;
    background: #16120e;
  }
  #eer-order * { box-sizing: border-box; }
  #eer-order .header {
    text-align: center;
    margin-bottom: 40px;
  }
  #eer-order .header .brand {
    font-size: 1.8rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #f3ece2;
    margin: 0 0 6px;
    font-weight: normal;
  }
  #eer-order .header .subtitle {
    font-size: 1rem;
    color: #b9a88f;
    margin: 0;
    letter-spacing: 2px;
  }
  #eer-order .card {
    background: #221c16;
    border: 1px solid #3a3126;
    border-radius: 10px;
    padding: 28px 24px;
  }
  #eer-order label {
    display: block;
    font-size: .9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #cbb89b;
    margin: 0 0 6px;
  }
  #eer-order .field { margin-bottom: 18px; }
  #eer-order select, #eer-order input[type="number"], #eer-order input[type="text"] {
    width: 100%;
    padding: 14px 12px;
    font-size: 1.05rem;
    font-family: inherit;
    border: 1px solid #4a3f30;
    border-radius: 8px;
    background: #16120e;
    color: #f3ece2;
  }
  #eer-order select option { background: #16120e; color: #f3ece2; }
  #eer-order .sig-toggle { margin-bottom: 10px; }
  #eer-order .sig-toggle label {
    display: inline-block;
    margin: 0 16px 8px 0;
    color: #f3ece2;
    text-transform: none;
    letter-spacing: 0;
    font-size: 1rem;
    cursor: pointer;
  }
  #eer-order .sig-toggle input[type="radio"] {
    width: auto;
    margin: 0 6px 0 0;
    vertical-align: middle;
  }
  #eer-order .sig-name-input { margin-top: 8px; }
  #eer-order .sig-hint { font-size: 0.85rem; color: #b9a88f; margin: 6px 0 0; }
  #eer-order .price-line { font-size: 1.2rem; color: #d8c5a6; margin: 8px 0 0; }
  #eer-order button {
    width: 100%;
    background: #d8c5a6;
    color: #16120e;
    border: none;
    border-radius: 8px;
    padding: 16px 22px;
    font-size: 1.15rem;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 8px;
  }
  #eer-order button:disabled { opacity: .5; cursor: not-allowed; }
  #eer-order .status {
    margin-top: 16px;
    font-size: .95rem;
    color: #cbb89b;
    min-height: 20px;
  }
  #eer-order .status.error { color: #e0a3a3; }
  #eer-order .status.success { color: #a9cfae; }
  #eer-order .disclaimer {
    margin-top: 18px;
    font-size: .85rem;
    color: #b9a88f;
    line-height: 1.5;
    text-align: center;
  }
  #eer-order .quiz-button {
    display: block;
    text-align: center;
    width: 100%;
    margin-top: 14px;
    padding: 10px 16px;
    font-size: .9rem;
    letter-spacing: .5px;
    color: #d8c5a6;
    background: transparent;
    border: 1px solid #4a3f30;
    border-radius: 8px;
    text-decoration: none;
    font-family: inherit;
    transition: background .15s ease, border-color .15s ease;
  }
  #eer-order .quiz-button:hover {
    background: #3a3126;
    border-color: #6a5a40;
  }
  #eer-order .quiz-note {
    margin-top: 12px;
    font-size: .85rem;
    color: #b9a88f;
    line-height: 1.5;
    text-align: center;
  }
  #eer-order .eer-product-row {
    border-bottom: 1px solid #3a3126;
    padding-bottom: 22px;
    margin-bottom: 22px;
    position: relative;
  }
  #eer-order .eer-product-row:last-child {
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  #eer-order .eer-remove-btn {
    position: absolute;
    top: 0;
    right: 0;
    background: none;
    border: none;
    color: #b9a88f;
    font-size: 1.4rem;
    cursor: pointer;
    padding: 0 4px;
    margin: 0;
    width: auto;
    letter-spacing: 0;
    text-transform: none;
    line-height: 1;
  }
  #eer-order .eer-remove-btn:hover { color: #e0a3a3; }
  #eer-order .eer-add-btn {
    width: 100%;
    background: transparent;
    color: #d8c5a6;
    border: 1px dashed #4a3f30;
    border-radius: 8px;
    padding: 14px 22px;
    font-size: 1rem;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: .5px;
    text-transform: none;
    margin: 24px 0;
    transition: background .15s ease, border-color .15s ease;
  }
  #eer-order .eer-add-btn:hover {
    background: #3a3126;
    border-color: #6a5a40;
  }

  @media (max-width: 600px) {
    #eer-order .brand { font-size: 1.5rem; }
    #eer-order .card { padding: 22px 18px; }
    #eer-order select, #eer-order input[type="number"], #eer-order input[type="text"] { font-size: 1.2rem; padding: 18px 14px; }
    #eer-order button { font-size: 1.3rem; padding: 20px 22px; }
    #eer-order label { font-size: 1rem; }
  }
</style>

<div id="eer-order">
  <div class="header">
    <h2 class="brand">East End Roses</h2>
    <p class="subtitle">Place Your Order</p>
  </div>

  <div class="card">
    <div id="eer-product-rows"></div>

    <button type="button" class="eer-add-btn" id="eer-add-product">+ Add another product</button>

    <button type="button" id="eer-submit">Place Order</button>
    <p class="status" id="eer-status"></p>
    <a href="https://eerfindmyfragrance.vercel.app/" target="_blank" rel="noopener" class="quiz-button">Take the quiz</a>
    <p class="quiz-note">Not sure which fragrance? Find your fragrance profile</p>
    <p class="disclaimer">You'll be taken to payment after you place your order.</p>
  </div>
</div>

<script>
(function () {
  var CANDLE_SCENTS = [
    "Lavender Oasis", "Fresh Eucalyptus", "Blooming Meadow", "Uncharted Forest",
    "Cashmere Plum", "Pomegranate Cider", "Midnight Moon", "Spiced Pear",
    "Tonka and Oud", "Fresh Coffee", "Cottage Garden", "Amber Musk",
    "Cinnamon Churro", "Laundry Day", "Cherry Blossom", "Morning Dewdrops",
    "Gathered", "Egyptian Amber", "Harvest Moon", "Maple Walnut Glaze",
    "Golden Orchard", "Forest Fog"
  ];

  var PRODUCTS = [
    {
      name: "Candle",
      price: "23.00",
      scents: CANDLE_SCENTS
    },
    {
      name: "Signature Fragrance Candle",
      price: "32.00",
      scents: [],
      customFragrance: true
    },
    {
      name: "Diffuser",
      price: "17.00",
      scents: [
        "Spiced Pear", "Vanilla Bean", "Cottage Garden", "Amber Musk",
        "Blooming Meadow", "Tulip Bouquet", "Forest Fog"
      ]
    },
    {
      name: "Wax Melts",
      price: "8.70",
      scents: CANDLE_SCENTS
    },
    {
      name: "Room Spray",
      price: "12.00",
      scents: [
        "Amber Musk", "Cottage Garden", "Midnight Moon", "Vanilla Bean",
        "Tonka and Oud", "Lavender Oasis", "Pomegranate Cider",
        "Gathered", "Egyptian Amber", "Harvest Moon", "Maple Walnut Glaze",
        "Golden Orchard", "Forest Fog"
      ]
    },
    {
      name: "Tulip Bouquet",
      price: "25.00",
      defaultScent: "Tulip Bouquet - *Standard*",
      scents: ["Tulip Bouquet - *Standard*"].concat(CANDLE_SCENTS),
      hasLabelText: true
    }
  ];

  var rowsContainer = document.getElementById("eer-product-rows");
  var addBtn = document.getElementById("eer-add-product");
  var submitBtn = document.getElementById("eer-submit");
  var statusEl = document.getElementById("eer-status");
  var rowCounter = 0;

  function findProduct(name) {
    for (var i = 0; i < PRODUCTS.length; i++) {
      if (PRODUCTS[i].name === name) return PRODUCTS[i];
    }
    return PRODUCTS[0];
  }

  function productOptsHtml() {
    var html = "";
    for (var i = 0; i < PRODUCTS.length; i++) {
      html += '<option value="' + PRODUCTS[i].name + '">' + PRODUCTS[i].name + '</option>';
    }
    return html;
  }

  function buildRow() {
    rowCounter++;
    var rowId = rowCounter;
    var row = document.createElement("div");
    row.className = "eer-product-row";
    var opts = productOptsHtml();

    row.innerHTML =
      '<button type="button" class="eer-remove-btn" title="Remove">&times;</button>' +
      '<div class="field">' +
        '<label>Product</label>' +
        '<select class="eer-product-select">' + opts + '</select>' +
        '<p class="price-line"></p>' +
      '</div>' +
      '<div class="field eer-scent-field">' +
        '<label>Fragrance</label>' +
        '<select class="eer-scent-select"></select>' +
      '</div>' +
      '<div class="field eer-signature-field" style="display:none;">' +
        '<label>Custom Fragrance</label>' +
        '<div class="sig-toggle">' +
          '<label><input type="radio" class="sig-mode-id" value="id" name="sig-mode-' + rowId + '" checked> I have a fragrance ID</label>' +
          '<label><input type="radio" class="sig-mode-name" value="name" name="sig-mode-' + rowId + '"> I\'ll type the name</label>' +
        '</div>' +
        '<input type="text" class="sig-id-input" placeholder="EER-FR-042">' +
        '<p class="sig-hint">Fragrance IDs look like EER-FR-### — the last 3 digits identify your custom fragrance.</p>' +
        '<input type="text" class="sig-name-input" placeholder="Fragrance name" style="display:none;">' +
      '</div>' +
      '<div class="field eer-label-field" style="display:none;">' +
        '<label>Label Text</label>' +
        '<input type="text" class="eer-label-input" placeholder="ex. Happy Birthday!" maxlength="60">' +
      '</div>' +
      '<div class="field">' +
        '<label>Quantity</label>' +
        '<input type="number" class="eer-qty-input" value="1" min="1" step="1">' +
      '</div>';

    return row;
  }

  function initRow(row) {
    var productSel = row.querySelector(".eer-product-select");
    var scentSel = row.querySelector(".eer-scent-select");
    var priceLine = row.querySelector(".price-line");
    var scentField = row.querySelector(".eer-scent-field");
    var sigField = row.querySelector(".eer-signature-field");
    var sigModeId = row.querySelector(".sig-mode-id");
    var sigModeName = row.querySelector(".sig-mode-name");
    var sigIdInput = row.querySelector(".sig-id-input");
    var sigNameInput = row.querySelector(".sig-name-input");
    var labelField = row.querySelector(".eer-label-field");
    var labelInput = row.querySelector(".eer-label-input");
    var removeBtn = row.querySelector(".eer-remove-btn");

    function refreshRow() {
      var prod = findProduct(productSel.value);
      scentSel.innerHTML = "";
      for (var i = 0; i < prod.scents.length; i++) {
        var opt = document.createElement("option");
        opt.value = prod.scents[i];
        opt.textContent = prod.scents[i];
        scentSel.appendChild(opt);
      }
      priceLine.textContent = "Price: $" + prod.price;
      if (prod.customFragrance) {
        scentField.style.display = "none";
        sigField.style.display = "block";
        updateSig();
      } else {
        scentField.style.display = "block";
        sigField.style.display = "none";
        sigIdInput.value = "";
        sigNameInput.value = "";
      }
      if (prod.hasLabelText) {
        labelField.style.display = "block";
      } else {
        labelField.style.display = "none";
        labelInput.value = "";
      }
    }

    function updateSig() {
      if (sigModeName.checked) {
        sigNameInput.style.display = "block";
        sigIdInput.style.display = "none";
      } else {
        sigIdInput.style.display = "block";
        sigNameInput.style.display = "none";
      }
    }

    productSel.addEventListener("change", refreshRow);
    sigModeId.addEventListener("change", updateSig);
    sigModeName.addEventListener("change", updateSig);
    removeBtn.addEventListener("click", function () {
      row.remove();
      toggleAddBtn();
    });

    refreshRow();
  }

  function addRow() {
    var row = buildRow();
    rowsContainer.appendChild(row);
    initRow(row);
    toggleAddBtn();
  }

  function toggleAddBtn() {
    addBtn.style.display = rowsContainer.children.length >= 5 ? "none" : "block";
  }

  addBtn.addEventListener("click", addRow);

  function collectItems() {
    var rows = rowsContainer.querySelectorAll(".eer-product-row");
    var items = [];
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      var prodSel = row.querySelector(".eer-product-select");
      var scentSel = row.querySelector(".eer-scent-select");
      var qtyInput = row.querySelector(".eer-qty-input");
      var labelInput = row.querySelector(".eer-label-input");
      var sigModeId = row.querySelector(".sig-mode-id");
      var sigIdInput = row.querySelector(".sig-id-input");
      var sigNameInput = row.querySelector(".sig-name-input");

      var prod = findProduct(prodSel.value);
      var scent;
      if (prod.customFragrance) {
        if (sigModeId.checked) {
          scent = sigIdInput.value.trim();
          if (!/^EER-FR-\d{3}$/i.test(scent)) {
            return { error: "Please enter your fragrance ID in the format EER-FR-###.", el: sigIdInput };
          }
          scent = scent.toUpperCase();
        } else {
          scent = sigNameInput.value.trim();
          if (scent === "") {
            return { error: "Please type your fragrance name.", el: sigNameInput };
          }
        }
      } else {
        scent = scentSel.value;
      }

      var qty = parseInt(qtyInput.value, 10);
      if (isNaN(qty) || qty < 1) qty = 1;

      var label = labelInput.value.trim();
      if (prod.hasLabelText && label === "") {
        return { error: "Please enter label text for your Tulip Bouquet.", el: labelInput };
      }

      items.push({
        product: prod.name,
        scent: scent,
        qty: qty,
        label: label || undefined
      });
    }
    return { items: items };
  }

  submitBtn.addEventListener("click", function () {
    var result = collectItems();
    if (result.error) {
      statusEl.textContent = result.error;
      statusEl.className = "status error";
      result.el.focus();
      return;
    }
    if (!result.items || result.items.length === 0) {
      statusEl.textContent = "Please add at least one product.";
      statusEl.className = "status error";
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = "Creating your secure payment link...";
    statusEl.className = "status";

    fetch("/api/order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items: result.items })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.success && data.url) {
          window.location.href = data.url;
        } else {
          submitBtn.disabled = false;
          var msg = data && data.error ? data.error : "Something went wrong. Please try again.";
          statusEl.textContent = msg;
          statusEl.className = "status error";
        }
      })
      .catch(function () {
        submitBtn.disabled = false;
        statusEl.textContent = "Could not reach the server. Please try again.";
        statusEl.className = "status error";
      });
  });

  function showThankYou(ref) {
    var card = document.querySelector("#eer-order .card");
    card.innerHTML =
      '<div class="thankyou">' +
        '<h3 style="margin:0 0 10px;color:#f3ece2;letter-spacing:1px;">Thank you for your order!</h3>' +
        '<p style="margin:0 0 6px;color:#d8c5a6;font-size:1.05rem;">Your payment was received and your order is being prepared.</p>' +
        '<p style="margin:0;color:#b9a88f;font-size:.9rem;">Order reference: <strong style="color:#d8c5a6;">' + ref + '</strong></p>' +
        '<p style="margin:14px 0 0;color:#b9a88f;font-size:.9rem;">A confirmation has also been sent to you by Square.</p>' +
      '</div>';
  }

  var refMatch = window.location.search.match(/[?&]ref=([A-Za-z0-9-]+)/);
  if (refMatch) showThankYou(refMatch[1]);

  addRow();
})();
</script>
