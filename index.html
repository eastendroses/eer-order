<!-- ============================================================
  East End Roses — Order Page (standalone / Vercel)
  ------------------------------------------------------------
  WHAT THIS DOES:
  Client picks product + scent + quantity. On "Place Order":
   1. Page asks /api/order to create a FRESH Square payment link
      for this order (with a unique order ref embedded).
   2. Client is sent to Secure Checkout and pays on Square.
   3. Square sends a payment.completed webhook to /api/square-webhook,
      which logs the PAID order to your Google Sheet (with name,
      email, and order ref). Nothing is logged until payment clears.
  ------------------------------------------------------------
  HOW TO EDIT (important):
  - PRODUCTS: edit names, prices, and scents below. Base prices are
    also used by api/order.js (cents) — keep them in sync.
  - If you arrive back on this page with ?ref=EER-XXXXXX in the
    URL, the page shows a "thank you" confirmation.
============================================================ -->

<style>
  #eer-order * { box-sizing: border-box; }
  #eer-order {
    max-width: 600px;
    margin: 0 auto;
    font-family: Georgia, 'Times New Roman', serif;
    color: #f3ece2;
    padding: 40px 20px;
    min-height: 100vh;
    background: #16120e;
  }
  #eer-order * { box-sizing: border-box; }
  #eer-order .header {
    text-align: center;
    margin-bottom: 40px;
  }
  #eer-order .header .brand {
    font-size: 1.8rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #f3ece2;
    margin: 0 0 6px;
    font-weight: normal;
  }
  #eer-order .header .subtitle {
    font-size: 1rem;
    color: #b9a88f;
    margin: 0;
    letter-spacing: 2px;
  }
  #eer-order .card {
    background: #221c16;
    border: 1px solid #3a3126;
    border-radius: 10px;
    padding: 28px 24px;
  }
  #eer-order label {
    display: block;
    font-size: .9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #cbb89b;
    margin: 0 0 6px;
  }
  #eer-order .field { margin-bottom: 18px; }
  #eer-order select, #eer-order input[type="number"], #eer-order input[type="text"] {
    width: 100%;
    padding: 14px 12px;
    font-size: 1.05rem;
    font-family: inherit;
    border: 1px solid #4a3f30;
    border-radius: 8px;
    background: #16120e;
    color: #f3ece2;
  }
  #eer-order select option { background: #16120e; color: #f3ece2; }
  #eer-order .price-line { font-size: 1.2rem; color: #d8c5a6; margin: 8px 0 0; }
  #eer-order button {
    width: 100%;
    background: #d8c5a6;
    color: #16120e;
    border: none;
    border-radius: 8px;
    padding: 16px 22px;
    font-size: 1.15rem;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 8px;
  }
  #eer-order button:disabled { opacity: .5; cursor: not-allowed; }
  #eer-order .status {
    margin-top: 16px;
    font-size: .95rem;
    color: #cbb89b;
    min-height: 20px;
  }
  #eer-order .status.error { color: #e0a3a3; }
  #eer-order .status.success { color: #a9cfae; }
  #eer-order .disclaimer {
    margin-top: 18px;
    font-size: .85rem;
    color: #b9a88f;
    line-height: 1.5;
    text-align: center;
  }
  #eer-order .quiz-button {
    display: block;
    text-align: center;
    width: 100%;
    margin-top: 14px;
    padding: 10px 16px;
    font-size: .9rem;
    letter-spacing: .5px;
    color: #d8c5a6;
    background: transparent;
    border: 1px solid #4a3f30;
    border-radius: 8px;
    text-decoration: none;
    font-family: inherit;
    transition: background .15s ease, border-color .15s ease;
  }
  #eer-order .quiz-button:hover {
    background: #3a3126;
    border-color: #6a5a40;
  }
  #eer-order .quiz-note {
    margin-top: 12px;
    font-size: .85rem;
    color: #b9a88f;
    line-height: 1.5;
    text-align: center;
  }

  @media (max-width: 600px) {
    #eer-order .brand { font-size: 1.5rem; }
    #eer-order .card { padding: 22px 18px; }
    #eer-order select, #eer-order input[type="number"], #eer-order input[type="text"] { font-size: 1.2rem; padding: 18px 14px; }
    #eer-order button { font-size: 1.3rem; padding: 20px 22px; }
    #eer-order label { font-size: 1rem; }
  }
</style>

<div id="eer-order">
  <div class="header">
    <h2 class="brand">East End Roses</h2>
    <p class="subtitle">Place Your Order</p>
  </div>

  <div class="card">
    <div class="field">
      <label for="eer-product">Product</label>
      <select id="eer-product"></select>
      <p class="price-line" id="eer-price"></p>
    </div>

    <div class="field">
      <label for="eer-scent">Fragrance</label>
      <select id="eer-scent"></select>
    </div>

    <div class="field" id="eer-label-field" style="display:none;">
      <label for="eer-label">Label Text</label>
      <input type="text" id="eer-label" placeholder="ex. Happy Birthday!" maxlength="60">
    </div>

    <div class="field">
      <label for="eer-qty">Quantity</label>
      <input type="number" id="eer-qty" value="1" min="1" step="1">
    </div>

    <button type="button" id="eer-submit">Place Order</button>
    <p class="status" id="eer-status"></p>
    <a href="https://eerfindmyfragrance.vercel.app/" target="_blank" rel="noopener" class="quiz-button">Take the quiz</a>
    <p class="quiz-note">Not sure which fragrance? Find your fragrance profile</p>
    <p class="disclaimer">You'll be taken to payment after you place your order.</p>
  </div>
</div>

<script>
(function () {
  // ============================================================
  // CONFIG — EDIT THESE
  // ============================================================
  // Order logging is handled by the Vercel proxy at /api/order,
  // which forwards orders to the Google Apps Script server-side.
  // No web app URL needed here.

  // 1) Products. "price" is shown for reference. The payment link is
  //    created fresh by /api/order for each order (no links here).
  //    "scents" is the list of available scents for that product.
  var CANDLE_SCENTS = [
    "Lavender Oasis", "Fresh Eucalyptus", "Blooming Meadow", "Uncharted Forest",
    "Cashmere Plum", "Pomegranate Cider", "Midnight Moon", "Spiced Pear",
    "Tonka and Oud", "Fresh Coffee", "Cottage Garden", "Amber Musk",
    "Cinnamon Churro", "Laundry Day", "Cherry Blossom", "Morning Dewdrops",
    "Gathered", "Egyptian Amber", "Harvest Moon", "Maple Walnut Glaze",
    "Golden Orchard", "Forest Fog"
  ];

  var PRODUCTS = [
    {
      name: "Candle",
      price: "23.00",
      scents: CANDLE_SCENTS
    },
    {
      name: "Diffuser",
      price: "17.00",
      scents: [
        "Spiced Pear", "Vanilla Bean", "Cottage Garden", "Amber Musk",
        "Blooming Meadow", "Tulip Bouquet", "Forest Fog"
      ]
    },
    {
      name: "Wax Melts",
      price: "8.70",
      scents: CANDLE_SCENTS
    },
    {
      name: "Room Spray",
      price: "12.00",
      scents: [
        "Amber Musk", "Cottage Garden", "Midnight Moon", "Vanilla Bean",
        "Tonka and Oud", "Lavender Oasis", "Pomegranate Cider",
        "Gathered", "Egyptian Amber", "Harvest Moon", "Maple Walnut Glaze",
        "Golden Orchard", "Forest Fog"
      ]
    },
    {
      name: "Tulip Bouquet",
      price: "25.00",
      defaultScent: "Tulip Bouquet - *Standard*",
      scents: ["Tulip Bouquet - *Standard*"].concat(CANDLE_SCENTS),
      hasLabelText: true
    }
  ];
  // ============================================================
  // END OF CONFIG
  // ============================================================

  var productSel = document.getElementById("eer-product");
  var scentSel = document.getElementById("eer-scent");
  var qtyInput = document.getElementById("eer-qty");
  var labelInput = document.getElementById("eer-label");
  var labelField = document.getElementById("eer-label-field");
  var priceLine = document.getElementById("eer-price");
  var submitBtn = document.getElementById("eer-submit");
  var statusEl = document.getElementById("eer-status");

  function currentProduct() {
    for (var i = 0; i < PRODUCTS.length; i++) {
      if (PRODUCTS[i].name === productSel.value) return PRODUCTS[i];
    }
    return PRODUCTS[0];
  }

  function populateProducts() {
    for (var i = 0; i < PRODUCTS.length; i++) {
      var opt = document.createElement("option");
      opt.value = PRODUCTS[i].name;
      opt.textContent = PRODUCTS[i].name;
      productSel.appendChild(opt);
    }
    refreshScent();
  }

  function refreshScent() {
    var prod = currentProduct();
    scentSel.innerHTML = "";
    for (var i = 0; i < prod.scents.length; i++) {
      var opt = document.createElement("option");
      opt.value = prod.scents[i];
      opt.textContent = prod.scents[i];
      scentSel.appendChild(opt);
    }
    priceLine.textContent = "Price: $" + prod.price;
    updateLabelField();
  }

  function updateLabelField() {
    var prod = currentProduct();
    if (prod.hasLabelText) {
      labelField.style.display = "block";
    } else {
      labelField.style.display = "none";
      labelInput.value = "";
    }
  }

  productSel.addEventListener("change", refreshScent);

  submitBtn.addEventListener("click", function () {
    var prod = currentProduct();
    var scent = scentSel.value;
    var qty = parseInt(qtyInput.value, 10);
    if (isNaN(qty) || qty < 1) qty = 1;

    var label = labelInput.value.trim();
    if (prod.hasLabelText && label === "") {
      statusEl.textContent = "Please enter label text for your tulip bouquet.";
      statusEl.className = "status error";
      labelInput.focus();
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = "Creating your secure payment link...";
    statusEl.className = "status";

    var payload = {
      product: prod.name,
      scent: scent,
      qty: qty
    };
    if (prod.hasLabelText) payload.label = label;

    fetch("/api/order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.success && data.url) {
          // Send the client to the fresh Square checkout link.
          window.location.href = data.url;
        } else {
          submitBtn.disabled = false;
          var msg = data && data.error ? data.error : "Something went wrong. Please try again.";
          statusEl.textContent = msg;
          statusEl.className = "status error";
        }
      })
      .catch(function () {
        submitBtn.disabled = false;
        statusEl.textContent = "Could not reach the server. Please try again.";
        statusEl.className = "status error";
      });
  });

  // Show a thank-you confirmation when the client returns after payment.
  function showThankYou(ref) {
    var card = document.querySelector("#eer-order .card");
    card.innerHTML =
      '<div class="thankyou">' +
        '<h3 style="margin:0 0 10px;color:#f3ece2;letter-spacing:1px;">Thank you for your order!</h3>' +
        '<p style="margin:0 0 6px;color:#d8c5a6;font-size:1.05rem;">Your payment was received and your order is being prepared.</p>' +
        '<p style="margin:0;color:#b9a88f;font-size:.9rem;">Order reference: <strong style="color:#d8c5a6;">' + ref + '</strong></p>' +
        '<p style="margin:14px 0 0;color:#b9a88f;font-size:.9rem;">A confirmation has also been sent to you by Square.</p>' +
      '</div>';
  }

  var refMatch = window.location.search.match(/[?&]ref=([A-Za-z0-9-]+)/);
  if (refMatch) showThankYou(refMatch[1]);

  populateProducts();
})();
</script>
